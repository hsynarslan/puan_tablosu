<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yaşar Üniversitesi Puan Tablosu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: page title, search + score-type chips, then one table per field group with a section header row */
:root{
  --bg:#f4f5f7; --surface:#ffffff; --ink:#1c2230; --muted:#5d6577; --line:#e1e4ea;
  --stripe:#f8f9fb; --head:#1f3a5f; --head-ink:#ffffff; --accent:#1f3a5f; --star:#a4462c;
  --f-display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-body:"Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151b; --surface:#191d25; --ink:#e6e9ef; --muted:#9aa2b2; --line:#2b313c;
  --stripe:#1d222b; --head:#2c4a73; --head-ink:#f2f5fa; --accent:#8fb2e3; --star:#e58b6f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151b; --surface:#191d25; --ink:#e6e9ef; --muted:#9aa2b2; --line:#2b313c;
  --stripe:#1d222b; --head:#2c4a73; --head-ink:#f2f5fa; --accent:#8fb2e3; --star:#e58b6f; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:1100px;margin:0 auto;padding-inline:20px;padding-block:32px 56px;display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,3.6vw,36px);margin:0;line-height:1.1;text-wrap:balance}
.sub{color:var(--muted);margin:0;max-width:70ch}
.tools{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center}
input[type=search]{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);width:280px;max-width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:14px;padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.chip:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.groups{display:flex;flex-direction:column;gap:24px}
.box{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:720px;font-variant-numeric:tabular-nums}
caption{caption-side:top;text-align:left;background:var(--head);color:var(--head-ink);font-family:var(--f-display);font-weight:600;font-size:18px;padding:12px 16px}
th,td{padding:10px 16px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--surface)}
tbody tr:nth-child(even){background:var(--stripe)}
tbody tr:last-child td{border-bottom:0}
.c{text-align:center}
.r{text-align:right}
.code{color:var(--muted);font-size:14px;white-space:nowrap}
.star{color:var(--star);font-weight:700}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:8px}
.notes{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.notes p{margin:0}
@media (max-width:520px){.wrap{padding-inline:16px}input[type=search]{width:100%}}
.masthead{background:#ffffff;border:1px solid var(--line);border-radius:8px;padding:20px 16px;display:flex;justify-content:center}
.masthead img{width:min(360px,100%);height:auto;display:block}
</style>
</head>

const toNum = s => (s === '--' || s === '') ? null : parseFloat(s.replace(',', '.'));
const toInt = s => { const n = parseInt(s.replace(/\./g, ''), 10); return n > 0 ? n : null; };
const DATA = RAW.trim().split('\n').map(line => {
  const [kod, prog, dil, burs, sure, tur, kont, sehit, min, max, sira] = line.split('|');
  return { kod, prog, dil, burs, tur, kont: +kont, sehit: +sehit, min: toNum(min), sira: toInt(sira) };
});

  ['Mühendislik', ['ELEKTRİK-ELEKTRONİK MÜHENDİSLİĞİ','ENDÜSTRİ MÜHENDİSLİĞİ','YAZILIM MÜHENDİSLİĞİ','BİLGİSAYAR MÜHENDİSLİĞİ','MAKİNE MÜHENDİSLİĞİ','İNŞAAT MÜHENDİSLİĞİ']],

  ['Dil ve Edebiyat', ['İNGİLİZ DİLİ VE EDEBİYATI','İNGİLİZCE MÜTERCİM VE TERCÜMANLIK']],
  ['Turizm ve Gastronomi', ['GASTRONOMİ VE MUTFAK SANATLARI','TURİZM REHBERLİĞİ']],
  ['Tarım Bilimleri', ['TARIM EKONOMİSİ','TARIM MAKİNELERİ VE TEKNOLOJİLERİ MÜHENDİSLİĞİ','TOPRAK BİLİMİ VE BİTKİ BESLEME']],
];
const BURS_ORDER = ['BURSLU','%50 İNDİRİMLİ','%25 İNDİRİMLİ','ÜCRETLİ'];
const BURS_LABEL = {'BURSLU':'Burslu','%50 İNDİRİMLİ':'%50 İndirimli','%25 İNDİRİMLİ':'%25 İndirimli','ÜCRETLİ':'Ücretli'};
const SMALL = new Set(['ve']);
const title = s => s.toLocaleLowerCase('tr-TR').split(' ').map(w => SMALL.has(w) ? w :
  w.split('-').map(p => p ? p[0].toLocaleUpperCase('tr-TR') + p.slice(1) : p).join('-')).join(' ');
const dilLabel = d => d === 'TÜRKÇE' ? '' : d.includes('%30') ? ' (%30 İngilizce)' : ' (İngilizce)';
const name = r => `${title(r.prog)}${dilLabel(r.dil)} (${BURS_LABEL[r.burs]})`;
const groupOf = r => r.tur === 'TYT' ? 'Meslek Yüksekokulu (Önlisans)' : (GROUPS.find(g => g[1].includes(r.prog)) || ['Diğer'])[0];
const ORDER = [...GROUPS.map(g => g[0]), 'Meslek Yüksekokulu (Önlisans)', 'Diğer'];
const STAR = '<span class="star">*</span>';
const fmtP = n => n == null ? STAR : n.toLocaleString('tr-TR', {minimumFractionDigits:3, maximumFractionDigits:3});
const fmtI = n => n == null ? STAR : n.toLocaleString('tr-TR');
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => s.toLocaleLowerCase('tr-TR');

DATA.forEach(r => { r.name = name(r); r.group = groupOf(r); });
const state = { q: '', tur: new Set() };
const $ = id => document.getElementById(id);

['SAY','EA','SÖZ','DİL','TYT'].forEach(t => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'chip'; b.textContent = t; b.setAttribute('aria-pressed', 'false');
  b.addEventListener('click', () => { state.tur.has(t) ? state.tur.delete(t) : state.tur.add(t); b.setAttribute('aria-pressed', state.tur.has(t)); render(); });
  $('f-tur').appendChild(b);
});
$('q').addEventListener('input', e => { state.q = e.target.value; render(); });

function render() {
  const q = norm(state.q.trim());
  const rows = DATA.filter(r => (!q || norm(r.name).includes(q) || r.kod.includes(q)) && (!state.tur.size || state.tur.has(r.tur)));
  const html = ORDER.map(g => {
    const list = rows.filter(r => r.group === g).sort((a, b) =>
      a.prog.localeCompare(b.prog, 'tr') || BURS_ORDER.indexOf(a.burs) - BURS_ORDER.indexOf(b.burs));
    if (!list.length) return '';
    return `<div class="box"><table>
      <caption>${esc(g)}</caption>
      <thead><tr><th>Program Kodu</th><th>Program Adı</th><th class="c">Puan Türü</th><th class="r">Kontenjan</th><th class="r">Taban Puanı</th><th class="r">Başarı Sırası</th></tr></thead>
      <tbody>${list.map(r => `<tr>
        <td class="code">${r.kod}</td>
        <td>${esc(r.name)}</td>
        <td class="c">${r.tur}</td>
        <td class="r">${r.kont}${r.sehit ? `+${r.sehit}` : ''}</td>
        <td class="r">${fmtP(r.min)}</td>
        <td class="r">${fmtI(r.sira)}</td>
      </tr>`).join('')}</tbody></table></div>`;
  }).join('');
  $('groups').innerHTML = html || '<div class="empty">Aramanıza uyan program bulunamadı.</div>';
}
